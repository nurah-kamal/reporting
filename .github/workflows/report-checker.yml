name: report-checker

on:
  push:
    branches: [main]
    paths: ['report-checker/**', '.github/workflows/report-checker.yml']
  pull_request:
    branches: [main]
    paths: ['report-checker/**', '.github/workflows/report-checker.yml']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: report-checker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm run check
      - run: npm test
      - run: npm run build
