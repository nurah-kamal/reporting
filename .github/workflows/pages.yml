name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: build sa-turnaround
        working-directory: sa-turnaround
        run: npm test && npm run build
      - name: build report-checker
        working-directory: report-checker
        run: npm test && npm run build
      - name: assemble the site
        run: |
          mkdir -p _site
          cp site-index/index.html site-index/styles.css _site/
          cp -r sa-turnaround/dist _site/sa-turnaround
          cp -r report-checker/dist _site/report-checker
          mkdir -p _site/plain-board
          cp -r plain-board/index.html plain-board/pages plain-board/assets _site/plain-board/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
